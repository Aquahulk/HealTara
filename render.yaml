services:
  - type: web
    name: docproc-web
    env: node
    rootDir: apps/web
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_ENV
        value: production
  - type: web
    name: docproc-api
    env: node
    rootDir: apps/api
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://heal-tara-web-git-main-zeds-projects-58878cb7.vercel.app,https://heal-tara-9qjqk6us2-zeds-projects-58878cb7.vercel.app,https://heal-tara-web.vercel.app,https://healtara.onrender.com,https://www.healtara.com,https://api.healtara.com,https://healtara.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001